name: Publish v0.4.5

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/publish-v0.4.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publish-v0.4.5
          fetch-depth: 0

      - name: Download exact Linux and Windows packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          base='https://github.com/taadaa95/canadapost-gui/releases/download/v0.4.5-transfer-1ed752f'
          for file in \
            Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage \
            Canada.Post.Claim.Runner-0.4.5-win-x64.exe \
            SHA256SUMS-transfer.txt
          do
            curl --fail --location --retry 40 --retry-delay 15 --retry-all-errors \
              "$base/$file" -o "publish/$file"
          done
          cd publish
          sha256sum -c SHA256SUMS-transfer.txt
          sha256sum \
            Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage \
            Canada.Post.Claim.Runner-0.4.5-win-x64.exe > SHA256SUMS.txt

      - name: Publish GitHub Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.4.5 --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create v0.4.5 \
            publish/Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage \
            publish/Canada.Post.Claim.Runner-0.4.5-win-x64.exe \
            publish/SHA256SUMS.txt \
            --title 'Canada Post Claim Runner 0.4.5' \
            --notes 'History improvements: retry Failed and Needs attention claims through Step 2, accurate History counts from the same current records shown in the table, simple status filtering, status color coding, and dynamic History updates after retry completion. Includes the v0.4.4 two-step workflow, Windows updater handoff, and shutdown reliability fixes.' \
            --latest

      - name: Record release metadata and remove temporary publication files
        shell: bash
        run: |
          set -euo pipefail
          sha_linux="$(sha256sum publish/Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage | awk '{print $1}')"
          sha_windows="$(sha256sum publish/Canada.Post.Claim.Runner-0.4.5-win-x64.exe | awk '{print $1}')"
          bytes_linux="$(stat -c '%s' publish/Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage)"
          bytes_windows="$(stat -c '%s' publish/Canada.Post.Claim.Runner-0.4.5-win-x64.exe)"
          mkdir -p releases
          cat > releases/v0.4.5.json <<JSON
          {
            "format": "canadapost-claim-runner-release-metadata",
            "metadataVersion": 1,
            "version": "0.4.5",
            "tag": "v0.4.5",
            "sourceRepository": "taadaa95/canadapost-gui",
            "sourceSha": "1ed752feb4fea66a4ecf03490688b368e5d9e163",
            "artifacts": {
              "linux": {
                "file": "Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage",
                "bytes": $bytes_linux,
                "sha256": "$sha_linux"
              },
              "windows": {
                "file": "Canada.Post.Claim.Runner-0.4.5-win-x64.exe",
                "bytes": $bytes_windows,
                "sha256": "$sha_windows"
              }
            },
            "automatedValidation": {
              "linux": {
                "status": "passed",
                "sourceSha": "1ed752feb4fea66a4ecf03490688b368e5d9e163",
                "workflowRun": "https://github.com/taadaa95/canadapost-gui/actions/runs/32539269591",
                "nativePackageBuild": "passed",
                "packageContentAudit": "passed",
                "packageSizeAudit": "passed",
                "releaseMetadataValidation": "passed",
                "provenanceGeneration": "passed",
                "manualValidation": "user-tested-history-feature-on-linux-test-build"
              },
              "windows": {
                "status": "passed",
                "sourceSha": "1ed752feb4fea66a4ecf03490688b368e5d9e163",
                "workflowRun": "https://github.com/taadaa95/canadapost-gui/actions/runs/32539269591",
                "nativePackageBuild": "passed",
                "packageContentAudit": "passed",
                "packageSizeAudit": "passed",
                "releaseMetadataValidation": "passed",
                "provenanceGeneration": "passed",
                "manualValidation": "not_performed_on_exact_public_binary"
              }
            },
            "manualValidation": {
              "status": "partial",
              "platform": "linux-x64",
              "validatedAt": "2026-08-22T00:00:00Z",
              "notes": "Kris manually validated the History behavior on Linux before publication. Exact public-binary physical validation remains pending, especially on Windows."
            },
            "buildOrigin": "github-actions-transfer-from-canonical-source",
            "releaseUrl": "https://github.com/taadaa95/canadapost-claim-runner-releases/releases/tag/v0.4.5"
          }
          JSON
          cp publish/SHA256SUMS.txt releases/v0.4.5-SHA256SUMS.txt
          rm -f .github/workflows/publish-v0.4.5.yml
          rm -f .github/KEEP .github/trigger-v045-publish .github/trigger-v045-publish-2
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'release: publish v0.4.5 metadata'
          git push origin HEAD:agent/publish-v0.4.5
