name: Publish v0.4.5

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/publish-v0.4.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publish-v0.4.5
          fetch-depth: 0
      - name: Download exact validated Linux and Windows packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p publish
          gh run download 32539269591 -R taadaa95/canadapost-gui --dir source-artifacts
          find source-artifacts -maxdepth 3 -type f -print
          linux="$(find source-artifacts -type f -name 'Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage' -print -quit)"
          windows="$(find source-artifacts -type f -name 'Canada.Post.Claim.Runner-0.4.5-win-x64.exe' -print -quit)"
          test -n "$linux"
          test -n "$windows"
          cp "$linux" publish/
          cp "$windows" publish/
          (cd publish && sha256sum Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage Canada.Post.Claim.Runner-0.4.5-win-x64.exe > SHA256SUMS.txt)
      - name: Publish GitHub Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.5 >/dev/null 2>&1; then
            gh release delete v0.4.5 --yes --cleanup-tag
          fi
          gh release create v0.4.5 \
            publish/Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage \
            publish/Canada.Post.Claim.Runner-0.4.5-win-x64.exe \
            publish/SHA256SUMS.txt \
            --title 'Canada Post Claim Runner 0.4.5' \
            --notes 'History improvements: retry failed and needs-attention claims through Step 2, accurate live History counts, simple status filtering/sorting, status color coding, and dynamic History updates after retry completion. Also retains the v0.4.4 two-step workflow and Windows shutdown/updater fixes.' \
            --latest
      - name: Remove temporary workflow and record release metadata
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-v0.4.5.yml
          mkdir -p releases
          sha_linux="$(sha256sum publish/Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage | awk '{print $1}')"
          sha_windows="$(sha256sum publish/Canada.Post.Claim.Runner-0.4.5-win-x64.exe | awk '{print $1}')"
          bytes_linux="$(stat -c '%s' publish/Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage)"
          bytes_windows="$(stat -c '%s' publish/Canada.Post.Claim.Runner-0.4.5-win-x64.exe)"
          cat > releases/v0.4.5.json <<JSON
          {
            "version": "0.4.5",
            "tag": "v0.4.5",
            "sourceSha": "1ed752feb4fea66a4ecf03490688b368e5d9e163",
            "manualValidation": { "status": "passed-by-user-on-linux-history-test; exact-public-binary-physical-validation-pending" },
            "artifacts": {
              "linux": {
                "file": "Canada.Post.Claim.Runner-0.4.5-linux-x86_64.AppImage",
                "bytes": $bytes_linux,
                "sha256": "$sha_linux"
              },
              "windows": {
                "file": "Canada.Post.Claim.Runner-0.4.5-win-x64.exe",
                "bytes": $bytes_windows,
                "sha256": "$sha_windows"
              }
            }
          }
          JSON
          cp publish/SHA256SUMS.txt releases/v0.4.5-SHA256SUMS.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'release: publish v0.4.5 metadata'
          git push origin HEAD:agent/publish-v0.4.5
